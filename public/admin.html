<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixIt.ro — Admin DB</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0D1117; --bg2:#161C27; --bg3:#1E2635;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
    --text:rgba(255,255,255,.9); --muted:rgba(255,255,255,.4);
    --blue:#3B82F6; --blue-dim:rgba(59,130,246,.15);
    --green:#22C55E; --green-dim:rgba(34,197,94,.15);
    --amber:#F59E0B; --amber-dim:rgba(245,158,11,.15);
    --red:#EF4444; --red-dim:rgba(239,68,68,.15);
    --purple:#A78BFA; --purple-dim:rgba(167,139,250,.15);
    --mono:'JetBrains Mono',monospace;
    --font:'DM Sans',sans-serif;
    --font-d:'Syne',sans-serif;
    --r:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);
    display:flex;height:100vh;overflow:hidden;}

  /* ── SIDEBAR ── */
  aside{width:220px;flex-shrink:0;background:var(--bg2);
    border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
  .sidebar-logo{font-family:var(--font-d);font-size:17px;font-weight:800;color:var(--text);}
  .sidebar-logo span{color:#FF6B6B;}
  .sidebar-tag{font-size:10px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;
    color:var(--muted);margin-top:2px;}
  .sidebar-section{padding:14px 10px 6px;font-size:10px;font-weight:600;
    letter-spacing:.8px;text-transform:uppercase;color:var(--muted);}
  .sidebar-item{display:flex;align-items:center;gap:9px;padding:8px 12px;
    border-radius:var(--r);margin:1px 6px;cursor:pointer;font-size:13px;
    color:rgba(255,255,255,.65);transition:all .15s;border:none;background:none;
    width:calc(100% - 12px);text-align:left;}
  .sidebar-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
  .sidebar-item.active{background:var(--blue-dim);color:var(--blue);}
  .sidebar-item .item-icon{font-size:14px;width:16px;text-align:center;}
  .sidebar-item .item-count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);
    padding:1px 6px;border-radius:10px;color:var(--muted);}
  .sidebar-item.active .item-count{background:rgba(59,130,246,.2);color:var(--blue);}

  /* ── MAIN ── */
  main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

  /* ── TOP BAR ── */
  .topbar{height:52px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    background:var(--bg2);flex-shrink:0;}
  .topbar-title{font-size:14px;font-weight:500;color:var(--text);}
  .topbar-right{display:flex;gap:10px;align-items:center;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
    animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .live-label{font-size:12px;color:var(--green);}
  .btn-refresh{padding:5px 12px;font-size:12px;font-family:var(--font);
    border:1px solid var(--border2);border-radius:var(--r);
    background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);
    cursor:pointer;transition:all .15s;}
  .btn-refresh:hover{background:rgba(255,255,255,.08);color:var(--text);}

  /* ── CONTENT ── */
  .content{flex:1;overflow-y:auto;padding:20px;}

  /* ── STATS CARDS ── */
  .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
    padding:16px;display:flex;align-items:center;gap:12px;}
  .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;
    align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .stat-val{font-family:var(--font-d);font-size:24px;font-weight:800;line-height:1;}
  .stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}

  /* ── TABLE PANEL ── */
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;margin-bottom:16px;}
  .panel-header{display:flex;align-items:center;justify-content:space-between;
    padding:13px 18px;border-bottom:1px solid var(--border);}
  .panel-title{font-size:13px;font-weight:500;color:var(--text);
    display:flex;align-items:center;gap:8px;}
  .panel-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
  .panel-actions{display:flex;gap:8px;}
  .btn-sm{padding:4px 10px;font-size:11px;font-family:var(--font);
    border:1px solid var(--border2);border-radius:6px;
    background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);
    cursor:pointer;transition:all .15s;}
  .btn-sm:hover{background:rgba(255,255,255,.08);color:var(--text);}

  /* ── DATA TABLE ── */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead tr{background:rgba(255,255,255,.03);}
  th{padding:9px 14px;text-align:left;font-size:10px;font-weight:600;
    letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);
    color:rgba(255,255,255,.8);white-space:nowrap;max-width:260px;
    overflow:hidden;text-overflow:ellipsis;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.02);}
  td.mono{font-family:var(--mono);font-size:11px;color:var(--muted);}
  td.id-col{font-family:var(--mono);font-size:11px;color:var(--muted);width:40px;}

  /* ── BADGES ── */
  .tag{display:inline-block;font-size:10px;font-weight:600;
    padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .tag-green{background:var(--green-dim);color:var(--green);}
  .tag-red{background:var(--red-dim);color:var(--red);}
  .tag-amber{background:var(--amber-dim);color:var(--amber);}
  .tag-blue{background:var(--blue-dim);color:var(--blue);}
  .tag-purple{background:var(--purple-dim);color:var(--purple);}
  .tag-gray{background:rgba(255,255,255,.06);color:var(--muted);}

  /* ── SQL RUNNER ── */
  .sql-wrap{padding:16px 18px;}
  .sql-label{font-size:11px;font-weight:600;letter-spacing:.5px;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .sql-editor{width:100%;min-height:100px;padding:12px 14px;
    font-family:var(--mono);font-size:12px;line-height:1.6;
    background:var(--bg3);border:1px solid var(--border2);
    border-radius:var(--r);color:var(--text);resize:vertical;outline:none;
    transition:border-color .15s;}
  .sql-editor:focus{border-color:var(--blue);}
  .sql-run-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .btn-run{padding:8px 20px;font-size:12px;font-weight:500;font-family:var(--font);
    background:var(--blue);color:#fff;border:none;border-radius:var(--r);
    cursor:pointer;transition:all .15s;}
  .btn-run:hover{background:#2563EB;}
  .btn-run:disabled{opacity:.5;cursor:not-allowed;}
  .sql-hint{font-size:11px;color:var(--muted);}
  .sql-presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
  .preset-btn{padding:5px 11px;font-size:11px;font-family:var(--mono);
    border:1px solid var(--border2);border-radius:6px;
    background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);
    cursor:pointer;transition:all .15s;white-space:nowrap;}
  .preset-btn:hover{background:rgba(255,255,255,.07);color:var(--text);}

  /* ── SQL RESULTS ── */
  #sql-result{margin-top:14px;}
  .result-meta{font-size:11px;color:var(--muted);margin-bottom:8px;
    display:flex;gap:16px;align-items:center;}
  .result-ok{color:var(--green);}
  .result-err{color:var(--red);}
  .result-err-box{background:var(--red-dim);border:1px solid rgba(239,68,68,.2);
    border-radius:var(--r);padding:12px 14px;font-family:var(--mono);
    font-size:12px;color:var(--red);}
  .empty-state{padding:32px;text-align:center;color:var(--muted);font-size:13px;}

  /* ── SCHEMA VIEW ── */
  .schema-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .schema-table{background:var(--bg3);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;}
  .schema-table-header{padding:11px 14px;background:rgba(255,255,255,.04);
    border-bottom:1px solid var(--border);font-size:12px;font-weight:500;
    display:flex;align-items:center;gap:8px;}
  .schema-row{display:flex;align-items:center;gap:8px;padding:7px 14px;
    border-bottom:1px solid rgba(255,255,255,.03);font-size:11px;}
  .schema-row:last-child{border:none;}
  .col-name{font-family:var(--mono);color:rgba(255,255,255,.8);min-width:140px;}
  .col-type{font-family:var(--mono);font-size:10px;color:var(--blue);}
  .col-flag{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:auto;}
  .flag-pk{background:var(--amber-dim);color:var(--amber);}
  .flag-fk{background:var(--purple-dim);color:var(--purple);}
  .flag-nn{background:rgba(255,255,255,.06);color:var(--muted);}
  .flag-uq{background:var(--green-dim);color:var(--green);}

  /* scrollbar */
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);}

  .loading{padding:24px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────────────────────── -->
<aside>
  <div class="sidebar-header">
    <div class="sidebar-logo">Fix<span>It</span>.ro</div>
    <div class="sidebar-tag">Admin · DB Explorer</div>
  </div>

  <div class="sidebar-section">Tabele</div>
  <button class="sidebar-item active" onclick="showView('dashboard',this)">
    <span class="item-icon">📊</span> Dashboard
  </button>
  <button class="sidebar-item" onclick="showView('utilizatori',this)">
    <span class="item-icon">👤</span> utilizatori
    <span class="item-count" id="cnt-utilizatori">—</span>
  </button>
  <button class="sidebar-item" onclick="showView('firme',this)">
    <span class="item-icon">🏢</span> firme
    <span class="item-count" id="cnt-firme">—</span>
  </button>
  <button class="sidebar-item" onclick="showView('lucrari',this)">
    <span class="item-icon">🔨</span> lucrari
    <span class="item-count" id="cnt-lucrari">—</span>
  </button>
  <button class="sidebar-item" onclick="showView('oferte',this)">
    <span class="item-icon">📤</span> oferte
    <span class="item-count" id="cnt-oferte">—</span>
  </button>
  <button class="sidebar-item" onclick="showView('recenzii',this)">
    <span class="item-icon">⭐</span> recenzii
    <span class="item-count" id="cnt-recenzii">—</span>
  </button>

  <div class="sidebar-section">Instrumente</div>
  <button class="sidebar-item" onclick="showView('sql',this)">
    <span class="item-icon">⌨️</span> SQL Runner
  </button>
  <button class="sidebar-item" onclick="showView('schema',this)">
    <span class="item-icon">📐</span> Schema
  </button>

  <div style="margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);">
    <a href="/" style="font-size:12px;color:var(--muted);text-decoration:none;
      display:flex;align-items:center;gap:6px;">
      ← Înapoi la FixIt.ro
    </a>
  </div>
</aside>

<!-- ── MAIN ─────────────────────────────────────────────────── -->
<main>
  <div class="topbar">
    <span class="topbar-title" id="topbar-title">Dashboard</span>
    <div class="topbar-right">
      <span class="live-dot"></span>
      <span class="live-label">Live</span>
      <button class="btn-refresh" onclick="refresh()">↻ Refresh</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Se încarcă...</div>
  </div>
</main>

<script>
// ============================================================
//  STATE
// ============================================================
let currentView = 'dashboard';
let counts = {};

// ============================================================
//  INIT
// ============================================================
async function init() {
  await loadCounts();
  showView('dashboard', document.querySelector('.sidebar-item.active'));
}

async function loadCounts() {
  try {
    const r = await fetch('/admin/api/counts');
    counts = await r.json();
    ['utilizatori','firme','lucrari','oferte','recenzii'].forEach(t => {
      const el = document.getElementById('cnt-' + t);
      if (el) el.textContent = counts[t] ?? '—';
    });
  } catch(e) {}
}

function refresh() { showView(currentView, document.querySelector('.sidebar-item.active')); }

// ============================================================
//  NAVIGARE
// ============================================================
function showView(view, btn) {
  currentView = view;
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const titles = {
    dashboard:'Dashboard',utilizatori:'Tabel: utilizatori',firme:'Tabel: firme',
    lucrari:'Tabel: lucrari',oferte:'Tabel: oferte',recenzii:'Tabel: recenzii',
    sql:'SQL Runner',schema:'Schema bază de date'
  };
  document.getElementById('topbar-title').textContent = titles[view] || view;

  const renders = {
    dashboard: renderDashboard, utilizatori: () => renderTable('utilizatori'),
    firme: () => renderTable('firme'), lucrari: () => renderTable('lucrari'),
    oferte: () => renderTable('oferte'), recenzii: () => renderTable('recenzii'),
    sql: renderSQL, schema: renderSchema
  };
  if (renders[view]) renders[view]();
}

// ============================================================
//  DASHBOARD
// ============================================================
async function renderDashboard() {
  await loadCounts();
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--blue-dim);">👤</div>
        <div><div class="stat-val" style="color:var(--blue);">${counts.utilizatori??0}</div><div class="stat-lbl">Utilizatori</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--purple-dim);">🏢</div>
        <div><div class="stat-val" style="color:var(--purple);">${counts.firme??0}</div><div class="stat-lbl">Firme</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--amber-dim);">🔨</div>
        <div><div class="stat-val" style="color:var(--amber);">${counts.lucrari??0}</div><div class="stat-lbl">Lucrări</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--green-dim);">📤</div>
        <div><div class="stat-val" style="color:var(--green);">${counts.oferte??0}</div><div class="stat-lbl">Oferte</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(251,191,36,.15);">⭐</div>
        <div><div class="stat-val" style="color:#FBBF24;">${counts.recenzii??0}</div><div class="stat-lbl">Recenzii</div></div>
      </div>
    </div>
    <div id="dash-tables"></div>`;

  // Încarcă preview pentru fiecare tabel
  ['utilizatori','firme','lucrari','oferte'].forEach(t => loadPreview(t));
}

async function loadPreview(tabel) {
  const data = await fetchTable(tabel, 5);
  const el   = document.getElementById('dash-tables');
  const div  = document.createElement('div');
  div.innerHTML = buildTableHTML(tabel, data, true);
  el.appendChild(div);
}

// ============================================================
//  TABLE VIEW
// ============================================================
async function renderTable(tabel) {
  document.getElementById('content').innerHTML = '<div class="loading">Se încarcă...</div>';
  const data = await fetchTable(tabel);
  document.getElementById('content').innerHTML = buildTableHTML(tabel, data, false);
}

async function fetchTable(tabel, limit = 500) {
  try {
    const r = await fetch(`/admin/api/table/${tabel}?limit=${limit}`);
    return await r.json();
  } catch(e) { return { rows: [], error: e.message }; }
}

function buildTableHTML(tabel, data, isPreview) {
  const { rows = [], error } = data;
  if (error) return `<div class="panel"><div class="panel-header"><span class="panel-title">${tabel}</span></div><div class="empty-state" style="color:var(--red);">Eroare: ${error}</div></div>`;

  const icons = {utilizatori:'👤',firme:'🏢',lucrari:'🔨',oferte:'📤',recenzii:'⭐'};
  const colors = {utilizatori:'blue',firme:'purple',lucrari:'amber',oferte:'green',recenzii:'amber'};
  const col = colors[tabel] || 'blue';

  let html = `<div class="panel">
    <div class="panel-header">
      <span class="panel-title">${icons[tabel]||'📋'} ${tabel}
        <span class="panel-badge tag tag-${col}">${rows.length} rânduri${isPreview?' (preview)':''}</span>
      </span>
      ${isPreview ? `<button class="btn-sm" onclick="showView('${tabel}',null)">Vezi tot →</button>` : ''}
    </div>`;

  if (!rows.length) {
    html += `<div class="empty-state">Niciun rând în tabel.</div>`;
  } else {
    const cols = Object.keys(rows[0]);
    html += `<div class="table-wrap"><table>
      <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(row => `<tr>${cols.map(c => `<td class="${getCellClass(c,row[c])}">${formatCell(c, row[c])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  }
  return html + '</div>';
}

function getCellClass(col, val) {
  if (col === 'id' || col.endsWith('_id')) return 'id-col';
  if (col === 'parola_hash' || col === 'token_activare') return 'mono';
  return '';
}

function formatCell(col, val) {
  if (val === null || val === undefined) return `<span style="color:var(--muted);font-style:italic;">NULL</span>`;
  if (col === 'parola_hash') return `<span style="color:var(--muted);">••••••••••••</span>`;
  if (col === 'token_activare') return val ? `<span style="font-family:var(--mono);font-size:10px;">${String(val).slice(0,16)}…</span>` : `<span style="color:var(--muted);">NULL</span>`;
  if (col === 'activ') return val ? `<span class="tag tag-green">✓ Activ</span>` : `<span class="tag tag-amber">⏳ Neactivat</span>`;
  if (col === 'urgenta') return val ? `<span class="tag tag-red">⚡ Urgent</span>` : `<span class="tag tag-gray">Normal</span>`;
  if (col === 'status') return formatStatus(val);
  if (col === 'tip_cont') return val === 'firma' ? `<span class="tag tag-purple">🏢 firmă</span>` : `<span class="tag tag-blue">👤 client</span>`;
  if (col === 'rating') return '★'.repeat(val) + '☆'.repeat(5 - val);
  if (col === 'pret') return `<span style="color:var(--green);font-weight:500;">${Number(val).toLocaleString('ro-RO')} lei</span>`;
  if (col === 'creat_la' || col === 'token_expira') return val ? `<span style="color:var(--muted);font-size:11px;">${val}</span>` : '—';
  const s = String(val);
  return s.length > 60 ? s.slice(0, 60) + '…' : escHtml(s);
}

function formatStatus(val) {
  const map = {
    activa:   ['green','Activă'],    in_lucru: ['amber','În lucru'],
    finalizata:['gray','Finalizată'], anulata:  ['red','Anulată'],
    trimisa:  ['blue','Trimisă'],    acceptata:['green','Acceptată'],
    refuzata: ['red','Refuzată'],
  };
  const [c, l] = map[val] || ['gray', val];
  return `<span class="tag tag-${c}">${l}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
//  SQL RUNNER
// ============================================================
const PRESETS = [
  { label: 'Toți userii',           sql: 'SELECT id, email, tip_cont, nume_complet,\n  CASE WHEN activ=1 THEN "Activ" ELSE "Neactivat" END AS status,\n  creat_la\nFROM utilizatori\nORDER BY creat_la DESC;' },
  { label: 'Lucrări + client',       sql: 'SELECT l.id, l.titlu, l.categorie, l.oras, l.status,\n  CASE WHEN l.urgenta=1 THEN "DA" ELSE "NU" END AS urgent,\n  u.email AS client_email, l.creat_la\nFROM lucrari l\nJOIN utilizatori u ON l.client_id = u.id\nORDER BY l.creat_la DESC;' },
  { label: 'Oferte detaliate',       sql: 'SELECT o.id, o.pret, o.status, o.disponibilitate,\n  l.titlu AS lucrare, l.oras,\n  f.nume_firma, f.categorie, o.creat_la\nFROM oferte o\nJOIN lucrari l ON o.lucrare_id = l.id\nJOIN firme f ON o.firma_id = f.id\nORDER BY o.creat_la DESC;' },
  { label: 'Rating firme',           sql: 'SELECT f.nume_firma, f.categorie, f.oras,\n  ROUND(AVG(r.rating), 2) AS rating_mediu,\n  COUNT(r.id) AS nr_recenzii\nFROM firme f\nLEFT JOIN recenzii r ON r.firma_id = f.id\nGROUP BY f.id\nORDER BY rating_mediu DESC;' },
  { label: 'Lucrări fără oferte',    sql: 'SELECT l.id, l.titlu, l.oras, l.categorie, l.creat_la\nFROM lucrari l\nLEFT JOIN oferte o ON o.lucrare_id = l.id\nWHERE o.id IS NULL\nORDER BY l.creat_la DESC;' },
  { label: 'Conturi neactivate',     sql: 'SELECT id, email, tip_cont, nume_complet, token_expira\nFROM utilizatori\nWHERE activ = 0\nORDER BY creat_la DESC;' },
];

function renderSQL() {
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">⌨️ SQL Runner</span>
        <span style="font-size:11px;color:var(--muted);">Doar SELECT (citire) — INSERT/UPDATE/DELETE dezactivate în interfață</span>
      </div>
      <div class="sql-wrap">
        <div class="sql-label">Query-uri rapide</div>
        <div class="sql-presets">
          ${PRESETS.map((p,i) => `<button class="preset-btn" onclick="loadPreset(${i})">${p.label}</button>`).join('')}
        </div>
        <div class="sql-label">Query personalizat</div>
        <textarea class="sql-editor" id="sql-input" placeholder="SELECT * FROM utilizatori LIMIT 10;"
          onkeydown="if((e=event).ctrlKey&&e.key==='Enter')runSQL()"></textarea>
        <div class="sql-run-row">
          <button class="btn-run" onclick="runSQL()" id="btn-run">▶ Rulează (Ctrl+Enter)</button>
          <span class="sql-hint">Atenție: query-urile care modifică date sunt blocate</span>
        </div>
        <div id="sql-result"></div>
      </div>
    </div>`;
}

function loadPreset(i) {
  document.getElementById('sql-input').value = PRESETS[i].sql;
}

async function runSQL() {
  const sql = document.getElementById('sql-input').value.trim();
  if (!sql) return;

  const btn = document.getElementById('btn-run');
  btn.disabled = true; btn.textContent = '⏳ Rulează...';

  const t0 = performance.now();
  try {
    const r    = await fetch('/admin/api/sql', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sql })
    });
    const data = await r.json();
    const ms   = Math.round(performance.now() - t0);
    renderSQLResult(data, ms);
  } catch(e) {
    document.getElementById('sql-result').innerHTML =
      `<div class="result-err-box">Eroare: ${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '▶ Rulează (Ctrl+Enter)';
  }
}

function renderSQLResult(data, ms) {
  const el = document.getElementById('sql-result');
  if (data.error) {
    el.innerHTML = `<div class="result-meta"><span class="result-err">✗ Eroare</span></div>
      <div class="result-err-box">${escHtml(data.error)}</div>`;
    return;
  }
  const rows = data.rows || [];
  if (!rows.length) {
    el.innerHTML = `<div class="result-meta"><span class="result-ok">✓ ${data.message || 'Executat'}</span> <span>${ms}ms</span></div>`;
    return;
  }
  const cols = Object.keys(rows[0]);
  el.innerHTML = `
    <div class="result-meta">
      <span class="result-ok">✓ ${rows.length} rânduri returnate</span>
      <span>${ms}ms</span>
    </div>
    <div class="table-wrap" style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden;">
      <table>
        <thead><tr>${cols.map(c=>`<th>${escHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(row=>`<tr>${cols.map(c=>`<td>${formatCell(c,row[c])}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
}

// ============================================================
//  SCHEMA
// ============================================================
function renderSchema() {
  const tables = {
    utilizatori: [
      {name:'id',type:'INTEGER',flag:'PK'},
      {name:'email',type:'VARCHAR(255)',flag:'UQ'},
      {name:'parola_hash',type:'VARCHAR(255)',flag:'NN'},
      {name:'tip_cont',type:"'client'|'firma'",flag:'NN'},
      {name:'nume_complet',type:'VARCHAR(255)',flag:'NN'},
      {name:'activ',type:'TINYINT',flag:'NN'},
      {name:'token_activare',type:'VARCHAR(64)',flag:'NULL'},
      {name:'token_expira',type:'DATETIME',flag:'NULL'},
      {name:'creat_la',type:'DATETIME',flag:'DEFAULT'},
    ],
    firme: [
      {name:'id',type:'INTEGER',flag:'PK'},
      {name:'utilizator_id',type:'INTEGER',flag:'FK→utilizatori'},
      {name:'nume_firma',type:'VARCHAR(255)',flag:'NN'},
      {name:'categorie',type:'VARCHAR(100)',flag:'NN'},
      {name:'oras',type:'VARCHAR(100)',flag:'NN'},
      {name:'raza_km',type:'INTEGER',flag:'DEFAULT 50'},
      {name:'descriere',type:'TEXT',flag:'NULL'},
      {name:'telefon',type:'VARCHAR(20)',flag:'NULL'},
      {name:'creat_la',type:'DATETIME',flag:'DEFAULT'},
    ],
    lucrari: [
      {name:'id',type:'INTEGER',flag:'PK'},
      {name:'client_id',type:'INTEGER',flag:'FK→utilizatori'},
      {name:'titlu',type:'VARCHAR(255)',flag:'NN'},
      {name:'descriere',type:'TEXT',flag:'NULL'},
      {name:'categorie',type:'VARCHAR(100)',flag:'NN'},
      {name:'oras',type:'VARCHAR(100)',flag:'NN'},
      {name:'adresa',type:'VARCHAR(255)',flag:'NULL'},
      {name:'urgenta',type:'TINYINT',flag:'DEFAULT 0'},
      {name:'status',type:"activa|in_lucru|...",flag:'NN'},
      {name:'creat_la',type:'DATETIME',flag:'DEFAULT'},
    ],
    oferte: [
      {name:'id',type:'INTEGER',flag:'PK'},
      {name:'lucrare_id',type:'INTEGER',flag:'FK→lucrari'},
      {name:'firma_id',type:'INTEGER',flag:'FK→firme'},
      {name:'pret',type:'DECIMAL(10,2)',flag:'NN'},
      {name:'descriere_oferta',type:'TEXT',flag:'NULL'},
      {name:'disponibilitate',type:'VARCHAR(255)',flag:'NULL'},
      {name:'status',type:"trimisa|acceptata|...",flag:'NN'},
      {name:'creat_la',type:'DATETIME',flag:'DEFAULT'},
    ],
    recenzii: [
      {name:'id',type:'INTEGER',flag:'PK'},
      {name:'firma_id',type:'INTEGER',flag:'FK→firme'},
      {name:'client_id',type:'INTEGER',flag:'FK→utilizatori'},
      {name:'lucrare_id',type:'INTEGER',flag:'FK→lucrari'},
      {name:'rating',type:'TINYINT(1-5)',flag:'NN'},
      {name:'comentariu',type:'TEXT',flag:'NULL'},
      {name:'creat_la',type:'DATETIME',flag:'DEFAULT'},
    ],
  };

  const flagClass = f => {
    if (f==='PK') return 'flag-pk';
    if (f.startsWith('FK')) return 'flag-fk';
    if (f==='UQ') return 'flag-uq';
    return 'flag-nn';
  };

  let html = '<div class="schema-col">';
  for (const [tname, cols] of Object.entries(tables)) {
    html += `<div class="schema-table">
      <div class="schema-table-header">
        <span style="color:var(--amber);font-family:var(--mono);font-size:12px;">⬜</span>
        <span style="font-family:var(--mono);font-size:12px;font-weight:600;">${tname}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--muted);">${cols.length} coloane</span>
      </div>
      ${cols.map(c => `
        <div class="schema-row">
          <span class="col-name">${c.name}</span>
          <span class="col-type">${c.type}</span>
          <span class="col-flag ${flagClass(c.flag)}">${c.flag}</span>
        </div>`).join('')}
    </div>`;
  }
  html += '</div>';

  document.getElementById('content').innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-header"><span class="panel-title">📐 Schema — 5 tabele, 38 coloane</span></div>
      <div style="padding:16px 18px;">${html}</div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-title">🔗 Relații (Foreign Keys)</span></div>
      <div style="padding:16px 18px;display:flex;flex-direction:column;gap:8px;">
        ${[
          ['firme.utilizator_id','utilizatori.id','1:1 — un cont firmă are un profil firmă'],
          ['lucrari.client_id','utilizatori.id','N:1 — un client poate posta mai multe lucrări'],
          ['oferte.lucrare_id','lucrari.id','N:1 — o lucrare poate primi mai multe oferte'],
          ['oferte.firma_id','firme.id','N:1 — o firmă poate trimite mai multe oferte'],
          ['recenzii.firma_id','firme.id','N:1 — o firmă poate primi mai multe recenzii'],
          ['recenzii.client_id','utilizatori.id','N:1 — un client poate lăsa mai multe recenzii'],
          ['recenzii.lucrare_id','lucrari.id','1:1 — o recenzie per lucrare'],
        ].map(([from,to,desc]) => `
          <div style="display:flex;align-items:center;gap:12px;font-size:12px;">
            <code style="font-family:var(--mono);color:var(--purple);background:var(--purple-dim);padding:3px 8px;border-radius:5px;">${from}</code>
            <span style="color:var(--muted);">→</span>
            <code style="font-family:var(--mono);color:var(--blue);background:var(--blue-dim);padding:3px 8px;border-radius:5px;">${to}</code>
            <span style="color:var(--muted);">${desc}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

init();
</script>
