<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixIt.ro — Fără conexiune</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8F9FB;
      color: #0D1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #1B4FD8;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }
    .icon {
      font-size: 72px;
      margin-bottom: 24px;
      opacity: 0.85;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #6B7280;
      line-height: 1.6;
      max-width: 300px;
      margin: 0 auto 32px;
    }
    button {
      background: #1B4FD8;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active { background: #1640b0; }
  </style>
</head>
<body>
  <div class="logo">FixIt.ro</div>
  <div class="icon">📡</div>
  <h1>Nu ești conectat la internet</h1>
  <p>Verifică conexiunea și încearcă din nou. Datele tale sunt în siguranță.</p>
  <button onclick="window.location.reload()">Încearcă din nou</button>
</body>
</html>
